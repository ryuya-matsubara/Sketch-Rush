<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#ff6b35">
  <meta name="application-name" content="Sketch Rush">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sketch Rush">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" href="./icons/sketch-rush-icon.png">
  <link rel="apple-touch-icon" href="./icons/sketch-rush-icon.png">
  <title>Sketch Rush | 3秒お絵かき記憶ゲーム</title>
  <style>
    :root {
      --ink: #20213a;
      --muted: #6f728f;
      --paper: #fffdf7;
      --orange: #ff6b35;
      --yellow: #ffd23f;
      --purple: #7357ff;
      --green: #22a86a;
      --red: #e84a5f;
      --shadow: 0 18px 50px rgba(47, 37, 85, .16);
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      color: var(--ink);
      font-family: system-ui, -apple-system, "Hiragino Sans", "Yu Gothic UI", sans-serif;
      background:
        radial-gradient(circle at 10% 10%, rgba(255,210,63,.55), transparent 30%),
        radial-gradient(circle at 90% 90%, rgba(115,87,255,.22), transparent 30%),
        #fff7e8;
      overscroll-behavior: none;
    }
    button, input { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }
    .app {
      width: min(100%, 560px);
      min-height: 100svh;
      margin: 0 auto;
      padding: max(18px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom));
      display: grid;
      align-items: center;
    }
    .screen {
      display: none;
      width: 100%;
      animation: appear .25s ease-out;
    }
    .screen.active { display: block; }
    .card {
      padding: clamp(22px, 6vw, 34px);
      border: 3px solid var(--ink);
      border-radius: 28px;
      background: rgba(255,253,247,.96);
      box-shadow: 8px 8px 0 var(--ink), var(--shadow);
    }
    .eyebrow {
      margin: 0 0 8px;
      color: var(--purple);
      font-size: .8rem;
      font-weight: 900;
      letter-spacing: .15em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-size: clamp(3rem, 14vw, 5.2rem);
      line-height: .88;
      letter-spacing: -.07em;
    }
    h1 span { display: block; color: var(--orange); }
    .lead {
      margin: 22px 0 26px;
      color: var(--muted);
      font-weight: 700;
      line-height: 1.8;
    }
    .settings {
      display: grid;
      gap: 14px;
      margin: 0 0 24px;
    }
    .setting-group {
      margin: 0;
      padding: 0;
      border: 0;
    }
    .setting-title {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: .82rem;
      font-weight: 900;
    }
    .choice-row {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: 1fr;
      gap: 8px;
    }
    .choice {
      position: relative;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .choice input {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }
    .choice span {
      display: grid;
      min-height: 48px;
      place-items: center;
      border: 2px solid var(--ink);
      border-radius: 14px;
      background: white;
      font-weight: 950;
      box-shadow: 3px 3px 0 var(--ink);
      transition: transform .1s, background .1s, color .1s;
    }
    .choice input:checked + span {
      color: white;
      background: var(--purple);
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0 var(--ink);
    }
    .choice input:focus-visible + span {
      outline: 4px solid rgba(115,87,255,.25);
      outline-offset: 2px;
    }
    .primary, .secondary {
      width: 100%;
      min-height: 58px;
      border: 3px solid var(--ink);
      border-radius: 18px;
      color: white;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 5px 5px 0 var(--ink);
      transition: transform .1s, box-shadow .1s;
    }
    .primary { background: var(--orange); }
    .secondary { background: var(--purple); }
    button:active:not(:disabled) {
      transform: translate(4px, 4px);
      box-shadow: 1px 1px 0 var(--ink);
    }
    button:disabled { cursor: default; opacity: .55; }
    .ready-card { text-align: center; }
    .ready-title {
      margin: 0;
      color: var(--muted);
      font-size: 1.1rem;
      font-weight: 900;
    }
    .ready-count {
      margin: 16px 0 12px;
      color: var(--orange);
      font-size: clamp(8rem, 42vw, 13rem);
      font-weight: 950;
      line-height: .9;
      text-shadow: 6px 6px 0 var(--ink);
      -webkit-text-stroke: 3px var(--ink);
    }
    .ready-message {
      margin: 0;
      color: var(--ink);
      font-weight: 900;
    }
    .game-head {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: end;
      gap: 12px;
      margin-bottom: 12px;
    }
    .prompt-label, .counter-label {
      color: var(--muted);
      font-size: .78rem;
      font-weight: 900;
    }
    .prompt {
      margin-top: 2px;
      font-size: clamp(2rem, 10vw, 3.2rem);
      font-weight: 950;
      line-height: 1;
    }
    .progress {
      font-size: 1.15rem;
      font-weight: 950;
      white-space: nowrap;
    }
    .canvas-wrap {
      position: relative;
      overflow: hidden;
      border: 4px solid var(--ink);
      border-radius: 22px;
      background: white;
      box-shadow: 6px 6px 0 var(--ink);
    }
    #drawCanvas {
      display: block;
      width: 100%;
      aspect-ratio: 4 / 5;
      background: white;
      cursor: crosshair;
      touch-action: none;
    }
    .timer-badge {
      position: absolute;
      top: 12px;
      right: 12px;
      display: grid;
      width: 76px;
      height: 76px;
      place-items: center;
      border: 4px solid var(--ink);
      border-radius: 50%;
      background: var(--yellow);
      font-size: 2.7rem;
      font-weight: 950;
      line-height: 1;
      box-shadow: 4px 4px 0 var(--ink);
      pointer-events: none;
    }
    .draw-hint {
      margin: 15px 0 0;
      color: var(--muted);
      text-align: center;
      font-size: .85rem;
      font-weight: 800;
    }
    .memory-card { padding: 18px; }
    .memory-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 0 2px 12px;
    }
    .phase-title { margin: 0; font-size: 1.15rem; }
    .saved-image {
      display: block;
      width: 100%;
      max-height: 48svh;
      aspect-ratio: 4 / 5;
      object-fit: contain;
      border: 3px solid var(--ink);
      border-radius: 18px;
      background: white;
    }
    .answer-area { margin-top: 16px; }
    #answerInput {
      width: 100%;
      min-height: 58px;
      padding: 0 17px;
      border: 3px solid var(--ink);
      border-radius: 16px;
      outline: none;
      background: white;
      color: var(--ink);
      font-size: 1.1rem;
      font-weight: 800;
    }
    #answerInput:focus { box-shadow: 0 0 0 4px rgba(115,87,255,.22); }
    .button-row { margin-top: 12px; }
    .feedback {
      display: none;
      margin: 15px 0 0;
      padding: 14px;
      border: 3px solid var(--ink);
      border-radius: 16px;
      font-weight: 900;
      text-align: center;
    }
    .feedback.show { display: block; animation: pop .2s ease-out; }
    .feedback.correct { background: #c8f5dc; color: #087542; }
    .feedback.wrong { background: #ffd8dd; color: #a0192e; }
    .result-card { text-align: center; }
    .result-icon { font-size: 4.5rem; line-height: 1; }
    .result-card h2 { margin: 14px 0 4px; font-size: 1.5rem; }
    .score {
      margin: 10px 0 0;
      color: var(--orange);
      font-size: clamp(3.2rem, 16vw, 5rem);
      font-weight: 950;
      letter-spacing: -.06em;
    }
    .rate { margin: 0 0 26px; color: var(--muted); font-size: 1.1rem; font-weight: 900; }
    .tiny { margin: 18px 0 0; color: var(--muted); font-size: .76rem; text-align: center; }
    @keyframes appear { from { opacity: 0; transform: translateY(8px); } }
    @keyframes pop { 50% { transform: scale(1.03); } }
    @media (min-width: 700px) {
      #drawCanvas, .saved-image { aspect-ratio: 5 / 4; }
      .memory-card { padding: 26px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="app">
    <section id="startScreen" class="screen active" aria-labelledby="gameTitle">
      <div class="card">
        <p class="eyebrow">Draw fast. Remember harder.</p>
        <h1 id="gameTitle">SKETCH <span>RUSH!</span></h1>
        <p class="lead">次々と絵を描いて、最後に自分の絵が何だったか当てよう。</p>
        <div class="settings" aria-label="ゲーム設定">
          <fieldset class="setting-group">
            <legend class="setting-title">1枚あたりの制限時間</legend>
            <div class="choice-row">
              <label class="choice">
                <input type="radio" name="seconds" value="2">
                <span>2秒</span>
              </label>
              <label class="choice">
                <input type="radio" name="seconds" value="2.5">
                <span>2.5秒</span>
              </label>
              <label class="choice">
                <input type="radio" name="seconds" value="3" checked>
                <span>3秒</span>
              </label>
            </div>
          </fieldset>
          <fieldset class="setting-group">
            <legend class="setting-title">問題数</legend>
            <div class="choice-row">
              <label class="choice">
                <input type="radio" name="rounds" value="10" checked>
                <span>10問</span>
              </label>
              <label class="choice">
                <input type="radio" name="rounds" value="15">
                <span>15問</span>
              </label>
              <label class="choice">
                <input type="radio" name="rounds" value="20">
                <span>20問</span>
              </label>
            </div>
          </fieldset>
        </div>
        <button id="startButton" class="primary" type="button">ゲームスタート</button>
      </div>
    </section>

    <section id="readyScreen" class="screen" aria-label="ゲーム開始カウントダウン">
      <div class="card ready-card">
        <p class="ready-title">指をキャンバスの上に準備！</p>
        <div id="readyCount" class="ready-count" aria-live="assertive">3</div>
        <p class="ready-message">このあと10問、ノンストップ！</p>
      </div>
    </section>

    <section id="drawScreen" class="screen" aria-label="お絵かきフェーズ">
      <div class="game-head">
        <div>
          <div class="prompt-label">今回のお題</div>
          <div id="promptText" class="prompt">りんご</div>
        </div>
        <div>
          <div class="counter-label">進行</div>
          <div id="drawProgress" class="progress">1 / 10</div>
        </div>
      </div>
      <div class="canvas-wrap">
        <canvas id="drawCanvas" aria-label="絵を描くキャンバス"></canvas>
        <div id="timerBadge" class="timer-badge" aria-live="polite">3</div>
      </div>
      <p class="draw-hint">考えるより先に描こう！</p>
    </section>

    <section id="memoryScreen" class="screen" aria-labelledby="memoryTitle">
      <div class="card memory-card">
        <div class="memory-head">
          <h2 id="memoryTitle" class="phase-title">これは何の絵？</h2>
          <span id="memoryProgress" class="progress">1 / 10</span>
        </div>
        <img id="savedImage" class="saved-image" alt="あなたが描いた絵">
        <form id="answerForm" class="answer-area">
          <label class="prompt-label" for="answerInput">描いたときのお題を入力</label>
          <input id="answerInput" type="text" enterkeyhint="done" autocomplete="off" autocapitalize="off" maxlength="30" required>
          <div class="button-row">
            <button id="answerButton" class="primary" type="submit">回答する</button>
            <button id="nextButton" class="secondary" type="button" hidden>次へ</button>
          </div>
        </form>
        <div id="feedback" class="feedback" role="status" aria-live="polite"></div>
      </div>
    </section>

    <section id="resultScreen" class="screen" aria-labelledby="resultTitle">
      <div class="card result-card">
        <div class="result-icon" aria-hidden="true">🏆</div>
        <h2 id="resultTitle">あなたの記憶スコア</h2>
        <div id="scoreText" class="score">0 / 10</div>
        <p id="rateText" class="rate">正答率：0%</p>
        <button id="replayButton" class="primary" type="button">もう一度遊ぶ</button>
      </div>
    </section>
  </main>

  <script>
    (() => {
      "use strict";

      const CONFIG = { rounds: 10, secondsPerRound: 3, readySeconds: 3 };
      const topic = (label, ...answers) => ({ label, answers: [label, ...answers] });
      const TOPICS = [
        topic("りんご", "林檎"), topic("犬", "いぬ"), topic("車", "くるま"),
        topic("太陽", "たいよう"), topic("魚", "さかな"), topic("傘", "かさ"),
        topic("家", "いえ"), topic("猫", "ねこ"), topic("花", "はな"),
        topic("時計", "とけい"), topic("バナナ"), topic("うさぎ", "兎"),
        topic("電車", "でんしゃ"), topic("月", "つき"), topic("鳥", "とり"),
        topic("靴", "くつ"), topic("木", "き"), topic("星", "ほし"),
        topic("コップ"), topic("めがね", "眼鏡"), topic("ケーキ"),
        topic("ロボット"), topic("船", "ふね"), topic("山", "やま"),
        topic("きのこ", "茸"), topic("ハート"), topic("雪だるま", "ゆきだるま", "雪達磨"),
        topic("カメラ"), topic("アイス", "アイスクリーム"), topic("かばん", "鞄"),
        topic("王冠", "おうかん"), topic("自転車", "じてんしゃ"), topic("へび", "蛇"),
        topic("飛行機", "ひこうき"), topic("ギター"), topic("おばけ", "お化け"),
        topic("パンダ"), topic("ライオン"), topic("ぞう", "象"), topic("きりん", "麒麟"),
        topic("さる", "猿"), topic("くま", "熊"), topic("ぶた", "豚"), topic("牛", "うし"),
        topic("馬", "うま"), topic("にわとり", "鶏"), topic("ひよこ", "雛"),
        topic("かえる", "蛙"), topic("かめ", "亀"), topic("たこ", "蛸"),
        topic("いか", "烏賊"), topic("くらげ", "海月"), topic("くじら", "鯨"),
        topic("さめ", "鮫"), topic("ちょう", "蝶"), topic("かぶとむし", "兜虫"),
        topic("てんとう虫", "てんとうむし", "天道虫"), topic("恐竜", "きょうりゅう"),
        topic("ドラゴン", "竜", "龍"), topic("にんじん", "人参"),
        topic("トマト"), topic("なす", "茄子"), topic("とうもろこし", "玉蜀黍"),
        topic("いちご", "苺"), topic("ぶどう", "葡萄"), topic("みかん", "蜜柑"),
        topic("すいか", "西瓜"), topic("さくらんぼ", "桜桃"), topic("もも", "桃"),
        topic("レモン", "檸檬"), topic("パン"), topic("おにぎり", "お握り"),
        topic("ラーメン"), topic("寿司", "すし"), topic("ハンバーガー"),
        topic("ピザ"), topic("ドーナツ"), topic("プリン"), topic("キャンディ", "飴", "あめ"),
        topic("鉛筆", "えんぴつ"), topic("はさみ", "鋏"), topic("本", "ほん"),
        topic("手紙", "てがみ"), topic("鍵", "かぎ"), topic("電球", "でんきゅう"),
        topic("電話", "でんわ"), topic("テレビ"), topic("パソコン"),
        topic("椅子", "いす"), topic("机", "つくえ"), topic("ベッド"),
        topic("歯ブラシ", "はぶらし"), topic("帽子", "ぼうし"), topic("シャツ"),
        topic("靴下", "くつした"), topic("指輪", "ゆびわ"), topic("リボン"),
        topic("宝箱", "たからばこ"), topic("風船", "ふうせん"), topic("旗", "はた"),
        topic("ボール"), topic("サッカーボール"), topic("バット"),
        topic("トロフィー"), topic("公園", "こうえん"), topic("学校", "がっこう"),
        topic("病院", "びょういん"), topic("城", "しろ"), topic("橋", "はし"),
        topic("信号", "しんごう"), topic("道路", "どうろ"), topic("バス"),
        topic("タクシー"), topic("救急車", "きゅうきゅうしゃ"), topic("消防車", "しょうぼうしゃ"),
        topic("ロケット"), topic("UFO", "ユーフォー"), topic("雲", "くも"),
        topic("雨", "あめ"), topic("雪", "ゆき"), topic("虹", "にじ"),
        topic("雷", "かみなり"), topic("海", "うみ"), topic("川", "かわ"),
        topic("島", "しま"), topic("火山", "かざん"), topic("炎", "ほのお"),
        topic("波", "なみ"), topic("桜", "さくら"), topic("ひまわり", "向日葵"),
        topic("チューリップ"), topic("サボテン"), topic("どんぐり", "団栗"),
        topic("葉っぱ", "はっぱ", "葉"), topic("プレゼント"), topic("音符", "おんぷ"),
        topic("ピアノ"), topic("太鼓", "たいこ"), topic("剣", "つるぎ", "けん"),
        topic("盾", "たて"), topic("魔法使い", "まほうつかい"), topic("忍者", "にんじゃ"),
        topic("宇宙人", "うちゅうじん"), topic("顔", "かお"), topic("手", "て"),
        topic("足", "あし"), topic("目", "め"), topic("口", "くち")
      ];

      const elements = {
        screens: [...document.querySelectorAll(".screen")],
        startScreen: document.getElementById("startScreen"),
        readyScreen: document.getElementById("readyScreen"),
        readyCount: document.getElementById("readyCount"),
        drawScreen: document.getElementById("drawScreen"),
        memoryScreen: document.getElementById("memoryScreen"),
        resultScreen: document.getElementById("resultScreen"),
        startButton: document.getElementById("startButton"),
        replayButton: document.getElementById("replayButton"),
        promptText: document.getElementById("promptText"),
        drawProgress: document.getElementById("drawProgress"),
        timerBadge: document.getElementById("timerBadge"),
        canvas: document.getElementById("drawCanvas"),
        memoryProgress: document.getElementById("memoryProgress"),
        savedImage: document.getElementById("savedImage"),
        answerForm: document.getElementById("answerForm"),
        answerInput: document.getElementById("answerInput"),
        answerButton: document.getElementById("answerButton"),
        nextButton: document.getElementById("nextButton"),
        feedback: document.getElementById("feedback"),
        secondsInputs: [...document.querySelectorAll('input[name="seconds"]')],
        roundsInputs: [...document.querySelectorAll('input[name="rounds"]')],
        scoreText: document.getElementById("scoreText"),
        rateText: document.getElementById("rateText")
      };

      const state = {
        phase: "start",
        prompts: [],
        drawings: [],
        memoryItems: [],
        roundIndex: 0,
        memoryIndex: 0,
        score: 0,
        answered: false,
        timerFrame: 0,
        deadline: 0
      };

      const ctx = elements.canvas.getContext("2d", { alpha: false });
      let drawing = false;
      let lastPoint = null;

      function shuffle(items) {
        const copy = [...items];
        for (let i = copy.length - 1; i > 0; i -= 1) {
          const j = Math.floor(Math.random() * (i + 1));
          [copy[i], copy[j]] = [copy[j], copy[i]];
        }
        return copy;
      }

      function shuffledForMemory(items) {
        if (items.length < 2) return [...items];
        let result = shuffle(items);
        const unchanged = result.every((item, index) => item === items[index]);
        if (unchanged) [result[0], result[1]] = [result[1], result[0]];
        return result;
      }

      function showScreen(screen) {
        elements.screens.forEach(item => item.classList.toggle("active", item === screen));
      }

      function resetState() {
        cancelAnimationFrame(state.timerFrame);
        Object.assign(state, {
          phase: "start",
          prompts: [],
          drawings: [],
          memoryItems: [],
          roundIndex: 0,
          memoryIndex: 0,
          score: 0,
          answered: false,
          timerFrame: 0,
          deadline: 0
        });
        drawing = false;
        lastPoint = null;
        elements.answerForm.reset();
        elements.feedback.className = "feedback";
        elements.feedback.textContent = "";
        elements.answerButton.hidden = false;
        elements.nextButton.hidden = true;
        elements.answerInput.disabled = false;
      }

      function resizeCanvas() {
        const rect = elements.canvas.getBoundingClientRect();
        if (!rect.width || !rect.height) return;

        const snapshot = document.createElement("canvas");
        snapshot.width = elements.canvas.width || 1;
        snapshot.height = elements.canvas.height || 1;
        snapshot.getContext("2d").drawImage(elements.canvas, 0, 0);

        const ratio = Math.min(window.devicePixelRatio || 1, 3);
        const width = Math.round(rect.width * ratio);
        const height = Math.round(rect.height * ratio);
        if (elements.canvas.width === width && elements.canvas.height === height) return;

        elements.canvas.width = width;
        elements.canvas.height = height;
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, width, height);
        if (snapshot.width > 1 && snapshot.height > 1) {
          ctx.drawImage(snapshot, 0, 0, snapshot.width, snapshot.height, 0, 0, width, height);
        }
        setupBrush();
      }

      function setupBrush() {
        const ratio = Math.min(window.devicePixelRatio || 1, 3);
        ctx.strokeStyle = "#20213a";
        ctx.lineWidth = 7 * ratio;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
      }

      function clearCanvas() {
        ctx.save();
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, elements.canvas.width, elements.canvas.height);
        ctx.restore();
        setupBrush();
      }

      function pointFromEvent(event) {
        const rect = elements.canvas.getBoundingClientRect();
        return {
          x: (event.clientX - rect.left) * (elements.canvas.width / rect.width),
          y: (event.clientY - rect.top) * (elements.canvas.height / rect.height)
        };
      }

      function beginStroke(event) {
        if (state.phase !== "drawing") return;
        event.preventDefault();
        drawing = true;
        lastPoint = pointFromEvent(event);
        elements.canvas.setPointerCapture?.(event.pointerId);
        ctx.beginPath();
        ctx.arc(lastPoint.x, lastPoint.y, ctx.lineWidth / 2, 0, Math.PI * 2);
        ctx.fillStyle = "#20213a";
        ctx.fill();
      }

      function continueStroke(event) {
        if (!drawing || state.phase !== "drawing") return;
        event.preventDefault();
        const point = pointFromEvent(event);
        ctx.beginPath();
        ctx.moveTo(lastPoint.x, lastPoint.y);
        ctx.lineTo(point.x, point.y);
        ctx.stroke();
        lastPoint = point;
      }

      function endStroke(event) {
        if (!drawing) return;
        event.preventDefault();
        drawing = false;
        lastPoint = null;
      }

      function startGame() {
        resetState();
        CONFIG.secondsPerRound = Number(
          elements.secondsInputs.find(input => input.checked).value
        );
        CONFIG.rounds = Number(
          elements.roundsInputs.find(input => input.checked).value
        );
        state.prompts = shuffle(TOPICS).slice(0, CONFIG.rounds);
        state.phase = "ready";
        showScreen(elements.readyScreen);
        elements.readyCount.textContent = String(CONFIG.readySeconds);
        state.deadline = performance.now() + CONFIG.readySeconds * 1000;
        state.timerFrame = requestAnimationFrame(updateReadyTimer);
      }

      function updateReadyTimer(now) {
        if (state.phase !== "ready") return;
        const remaining = Math.max(0, state.deadline - now);
        elements.readyCount.textContent = String(Math.max(1, Math.ceil(remaining / 1000)));

        if (remaining <= 0) {
          state.phase = "drawing";
          showScreen(elements.drawScreen);
          resizeCanvas();
          startRound();
          return;
        }
        state.timerFrame = requestAnimationFrame(updateReadyTimer);
      }

      function startRound() {
        drawing = false;
        lastPoint = null;
        clearCanvas();
        elements.promptText.textContent = state.prompts[state.roundIndex].label;
        elements.drawProgress.textContent = `${state.roundIndex + 1} / ${CONFIG.rounds}`;
        elements.timerBadge.textContent = String(CONFIG.secondsPerRound);
        state.deadline = performance.now() + CONFIG.secondsPerRound * 1000;
        state.timerFrame = requestAnimationFrame(updateTimer);
      }

      function updateTimer(now) {
        if (state.phase !== "drawing") return;
        const remaining = Math.max(0, state.deadline - now);
        elements.timerBadge.textContent = String(Math.max(1, Math.ceil(remaining / 1000)));

        if (remaining <= 0) {
          finishRound();
          return;
        }
        state.timerFrame = requestAnimationFrame(updateTimer);
      }

      function finishRound() {
        drawing = false;
        const currentTopic = state.prompts[state.roundIndex];
        state.drawings.push({
          prompt: currentTopic.label,
          answers: currentTopic.answers,
          image: elements.canvas.toDataURL("image/png")
        });
        state.roundIndex += 1;

        if (state.roundIndex < CONFIG.rounds) {
          startRound();
        } else {
          startMemoryPhase();
        }
      }

      function startMemoryPhase() {
        state.phase = "memory";
        state.memoryItems = shuffledForMemory(state.drawings);
        state.memoryIndex = 0;
        state.score = 0;
        showScreen(elements.memoryScreen);
        renderMemoryQuestion();
      }

      function renderMemoryQuestion() {
        state.answered = false;
        const item = state.memoryItems[state.memoryIndex];
        elements.memoryProgress.textContent = `${state.memoryIndex + 1} / ${CONFIG.rounds}`;
        elements.savedImage.src = item.image;
        elements.answerForm.reset();
        elements.answerInput.disabled = false;
        elements.answerButton.hidden = false;
        elements.nextButton.hidden = true;
        elements.feedback.className = "feedback";
        elements.feedback.textContent = "";
        setTimeout(() => elements.answerInput.focus({ preventScroll: true }), 50);
      }

      function normalizeAnswer(value) {
        return value
          .normalize("NFKC")
          .replace(/[\s\u3000]+/g, "")
          .toLocaleLowerCase("ja")
          .replace(/[ァ-ヶ]/g, character =>
            String.fromCharCode(character.charCodeAt(0) - 0x60)
          );
      }

      function judgeAnswer(event) {
        event.preventDefault();
        if (state.answered) return;

        const answer = elements.answerInput.value;
        if (!answer.trim()) {
          elements.answerInput.focus();
          return;
        }

        state.answered = true;
        const currentItem = state.memoryItems[state.memoryIndex];
        const correctPrompt = currentItem.prompt;
        const normalizedAnswer = normalizeAnswer(answer);
        const isCorrect = currentItem.answers.some(
          accepted => normalizedAnswer === normalizeAnswer(accepted)
        );

        if (isCorrect) {
          state.score += 1;
          elements.feedback.textContent = "正解！";
          elements.feedback.className = "feedback correct show";
        } else {
          elements.feedback.textContent = `不正解　正解：${correctPrompt}`;
          elements.feedback.className = "feedback wrong show";
        }

        elements.answerInput.disabled = true;
        elements.answerButton.hidden = true;
        elements.nextButton.hidden = false;
        elements.nextButton.textContent =
          state.memoryIndex === CONFIG.rounds - 1 ? "結果を見る" : "次へ";
        elements.nextButton.focus({ preventScroll: true });
      }

      function nextQuestion() {
        if (!state.answered) return;
        state.memoryIndex += 1;
        if (state.memoryIndex >= CONFIG.rounds) {
          showResult();
        } else {
          renderMemoryQuestion();
        }
      }

      function showResult() {
        state.phase = "result";
        const rate = Math.round((state.score / CONFIG.rounds) * 100);
        elements.scoreText.textContent = `${state.score} / ${CONFIG.rounds}`;
        elements.rateText.textContent = `正答率：${rate}%`;
        showScreen(elements.resultScreen);
      }

      elements.canvas.addEventListener("pointerdown", beginStroke);
      elements.canvas.addEventListener("pointermove", continueStroke);
      elements.canvas.addEventListener("pointerup", endStroke);
      elements.canvas.addEventListener("pointercancel", endStroke);
      elements.canvas.addEventListener("contextmenu", event => event.preventDefault());
      elements.startButton.addEventListener("click", startGame);
      elements.replayButton.addEventListener("click", startGame);
      elements.answerForm.addEventListener("submit", judgeAnswer);
      elements.nextButton.addEventListener("click", nextQuestion);
      window.addEventListener("resize", resizeCanvas);
      new ResizeObserver(resizeCanvas).observe(elements.canvas);

      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("./sw.js").catch(() => {
            // The game still works online when service worker registration fails.
          });
        });
      }

      resizeCanvas();
    })();
  </script>
</body>
</html>
